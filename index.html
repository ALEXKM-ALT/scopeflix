<!DOCTYPE html>
<html>
<head>
    <title>Scopeflix</title>
    <style>
        body {
            margin: 0;
            padding: 50px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 350px;
            text-align: center;
        }
        h1 { color: #667eea; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #ddd;
        }
        button {
            background: #667eea;
            color: white;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎬 Scopeflix</h1>
        <input type="text" id="name" placeholder="Your Name">
        <input type="text" id="phone" placeholder="Phone Number">
        <button onclick="login()">Join</button>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        function login() {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            if (name && phone) {
                const user = { id: Date.now().toString(), name: name, phone: phone };
                localStorage.setItem('user', JSON.stringify(user));
                window.location.href = '/chat.html';
            }
        }
    </script>
</body>
</html>
